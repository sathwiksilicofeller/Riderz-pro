# nginx site for riderzpro.com (docs/DEPLOY.md section 7).
#
# Install:
#   sudo cp deploy/nginx/riderzpro.com.conf /etc/nginx/sites-available/riderzpro.com
#   sudo ln -sf /etc/nginx/sites-available/riderzpro.com /etc/nginx/sites-enabled/riderzpro.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Compare with the live file first (sudo nginx -T): keep anything the server needs that isn't here.
# Certificates come from certbot: sudo certbot certonly --nginx -d riderzpro.com -d www.riderzpro.com
# (if the certificate has no www name, drop the www server block below or add www to the certificate).
# /_next/static needs no block of its own: the app already marks it "immutable".
# If Cloudflare or another proxy sits in front of nginx, set up the real_ip module first (see DEPLOY.md).

# WebSocket-style upgrade only when the browser asks for one; plain keep-alive otherwise.
map $http_upgrade $riderzpro_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream riderzpro_app {
    # The app listens on localhost only (next start -H 127.0.0.1 -p 3000). Keep port 3000 private:
    # anyone reaching it directly could fake X-Real-IP.
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---- http: everything to https (certbot renewals still work over http) ------------------------
server {
    listen 80;
    listen [::]:80;
    server_name riderzpro.com www.riderzpro.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://riderzpro.com$request_uri;
    }
}

# ---- https: www to the bare domain ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx 1.25.1+; on older nginx remove this line and use "listen 443 ssl http2;"
    server_name www.riderzpro.com;

    ssl_certificate     /etc/letsencrypt/live/riderzpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riderzpro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://riderzpro.com$request_uri;
}

# ---- https: the site --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name riderzpro.com;

    ssl_certificate     /etc/letsencrypt/live/riderzpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riderzpro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Seller uploads go up to 5 MB; nginx's default of 1 MB would refuse them.
    client_max_body_size 10m;

    # The app sends its own security headers (next.config.ts), including HSTS in production. This
    # one covers responses nginx makes itself (errors while the app restarts). No includeSubDomains,
    # so a subdomain still on http keeps working; same value as the app's, which is hidden so the
    # header isn't sent twice.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/manifest+json image/svg+xml;

    location / {
        proxy_pass http://riderzpro_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $riderzpro_connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # The app compares the browser's Origin with this; without it every sign-in and order gets a 403.
        proxy_set_header Host $host;

        # The visitor's address, for sign-in and order limits. Without it all visitors share one limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # Ask AI answers and the hourly job can take a while; 90s matches the cron's --max-time.
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
